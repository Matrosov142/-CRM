name: POTOK CRM release gate

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  backend-postgres:
    timeout-minutes: 20
    name: Backend + PostgreSQL 16 + RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: potok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d potok_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://potok_runtime:potok_runtime_test_secret@localhost:5432/potok_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://potok_owner:potok_owner_test_secret@localhost:5432/potok_test
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/potok_test
      TEST_RUNTIME_DATABASE_URL: postgresql://potok_runtime:potok_runtime_test_secret@localhost:5432/potok_test
      JWT_SECRET: ci-only-secret-not-for-production-000000000000
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Create separate non-superuser owner and runtime roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d potok_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE potok_owner LOGIN PASSWORD 'potok_owner_test_secret'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE potok_runtime LOGIN PASSWORD 'potok_runtime_test_secret'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT CONNECT ON DATABASE potok_test TO potok_owner, potok_runtime;
          GRANT USAGE, CREATE ON SCHEMA public TO potok_owner;
          GRANT USAGE ON SCHEMA public TO potok_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE potok_owner IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO potok_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE potok_owner IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO potok_runtime;
          SQL
      - name: Apply migrations twice as non-superuser schema owner
        run: |
          alembic upgrade head
          alembic upgrade head
      - name: Grant runtime access to existing schema objects
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d potok_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO potok_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO potok_runtime;
          REVOKE UPDATE, DELETE ON audit_events FROM potok_runtime;
          SQL
      - name: Run release QA including PostgreSQL RLS matrix
        run: |
          set -o pipefail
          python tools/qa_release.py 2>&1 | tee docs/CI_QA_LOG.txt
      - name: Upload backend QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potok-backend-qa-evidence
          path: |
            docs/CI_QA_LOG.txt
            docs/QA_REPORT_PILOT_0_25.json

  frontend:
    timeout-minutes: 15
    name: Frontend reproducible production build
    runs-on: ubuntu-latest
    outputs:
      lockfile_present: ${{ steps.lockfile.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check for committed lockfile
        id: lockfile
        run: |
          if test -f frontend/package-lock.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate temporary npm lockfile candidate
        if: steps.lockfile.outputs.present != 'true'
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact dependency tree
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-report.json
          audit_status=$?
          cat npm-audit-report.json
          exit "$audit_status"
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Upload npm lockfile candidate
        if: always() && steps.lockfile.outputs.present != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: potok-frontend-package-lock-candidate
          path: |
            frontend/package-lock.json
            frontend/npm-audit-report.json
          if-no-files-found: error

  frontend-lockfile-committed:
    name: Require frontend lockfile committed to the branch
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Require committed package-lock.json
        run: test -f frontend/package-lock.json

  browser-e2e:
    timeout-minutes: 35
    name: Browser E2E against disposable pilot stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r tests/requirements-e2e.txt pip-audit
          pip-audit -r tests/requirements-e2e.txt
          python -m playwright install --with-deps chromium
      - name: Create isolated E2E secrets
        run: |
          umask 077
          printf 'DB_ADMIN_PASSWORD=%s\nDB_OWNER_PASSWORD=%s\nRUNTIME_DB_PASSWORD=%s\nJWT_SECRET=%s\n' \
            'e2e-admin-only-not-production' \
            'e2e-owner-only-not-production' \
            'e2e-runtime-only-not-production' \
            'e2e-jwt-only-not-production-secret-000000000000' > .env.e2e
      - name: Start disposable E2E stack with browser registration enabled
        run: docker compose --env-file .env.e2e -f compose.pilot.yml -f .github/compose.e2e.yml up -d --build
      - name: Wait for web and API through the browser ingress
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health/ready >/dev/null \
              && curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose --env-file .env.e2e -f compose.pilot.yml -f .github/compose.e2e.yml ps -a
          docker compose --env-file .env.e2e -f compose.pilot.yml -f .github/compose.e2e.yml logs --no-color
          exit 1
      - name: Run real Chromium browser flows
        env:
          POTOK_E2E_BASE_URL: http://127.0.0.1:18080
          POTOK_E2E_UNTRUSTED_URL: http://127.0.0.1:18081
        run: python -m pytest -q tests/e2e/test_release_gate_browser.py
      - name: Show disposable E2E service logs on failure
        if: failure()
        run: docker compose --env-file .env.e2e -f compose.pilot.yml -f .github/compose.e2e.yml logs --no-color
      - name: Tear down disposable E2E database and files
        if: always()
        run: |
          docker compose --env-file .env.e2e -f compose.pilot.yml -f .github/compose.e2e.yml down -v --remove-orphans || true
          rm -f .env.e2e

  docker-smoke:
    timeout-minutes: 25
    name: Docker Compose runtime smoke test
    runs-on: ubuntu-latest
    # The Compose stack is an independent release surface. Run it even when
    # the frontend lockfile/build gate fails so runtime and restore defects are visible.
    needs: [backend-postgres, frontend]
    if: always() && needs.backend-postgres.result == 'success' && needs.frontend.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4
      - name: Download runner-generated npm lockfile candidate
        if: needs.frontend.outputs.lockfile_present != 'true'
        uses: actions/download-artifact@v4
        with:
          name: potok-frontend-package-lock-candidate
          path: frontend
      - name: Create CI-only secrets
        run: |
          umask 077
          printf 'DB_ADMIN_PASSWORD=%s\nDB_OWNER_PASSWORD=%s\nRUNTIME_DB_PASSWORD=%s\nJWT_SECRET=%s\n' \
            'ci-admin-password-not-for-production' \
            'ci-owner-password-not-for-production' \
            'ci-runtime-password-not-for-production' \
            'ci-only-jwt-secret-not-for-production-000000000000' > .env.pilot
      - name: Build and start full pilot stack
        run: |
          if ! docker compose --env-file .env.pilot -f compose.pilot.yml up -d --build; then
            docker compose --env-file .env.pilot -f compose.pilot.yml ps -a || true
            docker compose --env-file .env.pilot -f compose.pilot.yml logs --no-color || true
            exit 1
          fi
      - name: Remove completed secret-bearing bootstrap and migration containers
        run: docker compose --env-file .env.pilot -f compose.pilot.yml rm -f db-bootstrap db-migrate
      - name: Verify API and web health through reverse proxy
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health/ready >/tmp/api-health.json \
              && curl -fsS http://127.0.0.1:18080/healthz >/tmp/web-health.txt; then
              cat /tmp/api-health.json
              cat /tmp/web-health.txt
              exit 0
            fi
            sleep 5
          done
          docker compose --env-file .env.pilot -f compose.pilot.yml ps
          docker compose --env-file .env.pilot -f compose.pilot.yml logs --no-color
          exit 1
      - name: Verify PostgreSQL role separation in the running pilot stack
        run: |
          ROLE_FLAGS="$(docker compose --env-file .env.pilot -f compose.pilot.yml exec -T db sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -U potok_admin -d potok_crm -Atc "SELECT (SELECT rolsuper FROM pg_roles WHERE rolname = '\''potok_owner'\'')::text || '\''|'\'' || (SELECT rolbypassrls FROM pg_roles WHERE rolname = '\''potok_owner'\'')::text || '\''|'\'' || (SELECT rolsuper FROM pg_roles WHERE rolname = '\''potok_runtime'\'')::text || '\''|'\'' || (SELECT rolbypassrls FROM pg_roles WHERE rolname = '\''potok_runtime'\'')::text"')"
          test "$ROLE_FLAGS" = "false|false|false|false"
          OWNER_TABLES="$(docker compose --env-file .env.pilot -f compose.pilot.yml exec -T db sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -U potok_admin -d potok_crm -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='\''public'\'' AND c.relkind='\''r'\'' AND c.relowner=(SELECT oid FROM pg_roles WHERE rolname='\''potok_owner'\'')"')"
          test "$OWNER_TABLES" -gt 0
          API_ENV_NAMES="$(docker compose --env-file .env.pilot -f compose.pilot.yml exec -T api sh -c 'env | cut -d= -f1')"
          ! printf '%s\n' "$API_ENV_NAMES" | grep -E '^(DB_ADMIN_PASSWORD|DB_OWNER_PASSWORD|MIGRATION_DATABASE_URL)$'
      - name: Run backup, checksum, database restore and document restore drill
        run: |
          docker compose --env-file .env.pilot -f compose.pilot.yml exec -T api sh -c 'mkdir -p /var/lib/potok-crm/documents/rc1-drill && printf "rc1-backup-ok" > /var/lib/potok-crm/documents/rc1-drill/sentinel.txt'
          BACKUP_DIR=./backups bash ./ops/backup-pilot.sh
          BACKUP_PATH="$(find ./backups -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          (cd "$BACKUP_PATH" && sha256sum -c SHA256SUMS)
          test -s "$BACKUP_PATH/database.dump"
          test -s "$BACKUP_PATH/documents.tar.gz"
          docker compose --env-file .env.pilot -f compose.pilot.yml exec -T db sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" createdb -U potok_admin potok_restore_test'
          cat "$BACKUP_PATH/database.dump" | docker compose --env-file .env.pilot -f compose.pilot.yml exec -T db sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" pg_restore --exit-on-error -U potok_admin -d potok_restore_test --no-owner'
          RESTORED_HEAD="$(docker compose --env-file .env.pilot -f compose.pilot.yml exec -T db sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -U potok_admin -d potok_restore_test -Atc "SELECT version_num FROM alembic_version"')"
          test "$RESTORED_HEAD" = "0033_company_registration_rls"
          RESTORED_TABLES="$(docker compose --env-file .env.pilot -f compose.pilot.yml exec -T db sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -U potok_admin -d potok_restore_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = '\''public'\'' AND table_type = '\''BASE TABLE'\''"')"
          test "$RESTORED_TABLES" -gt 0
          mkdir -p /tmp/potok-documents-restored
          tar -xzf "$BACKUP_PATH/documents.tar.gz" -C /tmp/potok-documents-restored
          test "$(cat /tmp/potok-documents-restored/documents/rc1-drill/sentinel.txt)" = "rc1-backup-ok"
          echo "Database restore head: $RESTORED_HEAD ($RESTORED_TABLES tables)"
          echo "Document restore sentinel: PASS"
      - name: Tear down CI stack and disposable volumes
        if: always()
        run: |
          docker compose --env-file .env.pilot -f compose.pilot.yml down -v --remove-orphans || true
          rm -f .env.pilot
          rm -rf ./backups
