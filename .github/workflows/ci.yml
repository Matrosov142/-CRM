name: ПОТОК CRM CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: potok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d potok_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/potok_test
      JWT_SECRET: ci-only-secret-do-not-use-in-production-0123456789
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/potok_test
      TEST_RUNTIME_DATABASE_URL: postgresql://potok_runtime:runtime-only@localhost:5432/potok_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Create least-privilege runtime role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d potok_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE potok_runtime LOGIN PASSWORD 'runtime-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE potok_test TO potok_runtime;
          GRANT USAGE ON SCHEMA public TO potok_runtime;
          SQL
      - name: Apply all migrations as schema owner
        run: alembic upgrade head
      - name: Grant runtime access without ownership or audit mutation
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d potok_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO potok_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO potok_runtime;
          REVOKE UPDATE, DELETE ON audit_events FROM potok_runtime;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO potok_runtime;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO potok_runtime;
          SQL
      - name: Python compile and static audit
        run: |
          python -m compileall -q app migrations tests
          python tools/release_audit.py
      - name: Full test suite including PostgreSQL RLS
        run: python -m pytest -q
